name: 'gaffer-uploader'
description:
  'Upload test runs and reports to Gaffer. Wraps the open-source gaffer CLI
  (https://github.com/gaffer-sh/gaffer); files >90 MB upload via R2 multipart
  automatically.'
author: 'gaffer.sh'

branding:
  icon: 'monitor'
  color: 'blue'

inputs:
  gaffer_upload_token:
    description:
      "Upload token for your Gaffer project (gfr_ prefix). Optional when the
      workflow grants `permissions: id-token: write`: the gaffer CLI then
      exchanges the runner's OIDC token automatically, with no stored token to
      create or rotate. A token here still takes precedence over OIDC when both
      are available."
    required: false
  gaffer_api_key:
    description:
      '[DEPRECATED - use gaffer_upload_token] Upload token for your Gaffer
      project'
    required: false
    deprecationMessage:
      'gaffer_api_key is deprecated. Please use gaffer_upload_token instead.'
  report_path:
    description: 'Path to the relevant report file or directory to upload.'
    required: true
  api_endpoint:
    description: 'Custom API endpoint URL (for preview/staging environments).'
    required: false
  commit_sha:
    description: 'Git commit SHA to associate with the test run report.'
    required: false
  branch:
    description: 'Git branch to associate with the test run report.'
    required: false
  test_framework:
    description: 'Test framework to associate with the test run report.'
    required: false
  test_suite:
    description:
      'Optional name of the test suite to associate with the test run report.'
    required: false
  upload_timeout:
    description:
      'Per-request HTTP timeout in seconds (default: 30). With multipart uploads
      each part PUT runs against this timeout, so bump it (e.g. to 300 or
      higher) for multi-gigabyte uploads.'
    required: false
    default: '30'
  max_file_size_mb:
    description:
      'Per-file size limit in MB (default: 100, platform max: 5000). Files above
      this are rejected up front. Multipart elevation above 90 MB is automatic;
      no separate flag is needed.'
    required: false
    default: '100'
  debug:
    description: 'Enable debug logging, including full API responses.'
    required: false
    default: 'false'
  cli_version:
    description:
      'Pin the gaffer CLI version installed by this action (default: tracks the
      version this action was released with). Override only if you need a newer
      CLI feature without waiting for a new gaffer-uploader release.'
    required: false
    default: ''

outputs:
  status:
    description: 'Upload status. "success" when the upload completed.'
  test_run_id:
    description: 'Gaffer upload session / test run ID.'
  project_id:
    description: 'Gaffer project ID that received the upload.'

runs:
  using: node24
  main: dist/index.js
