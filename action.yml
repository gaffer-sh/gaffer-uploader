name: 'gaffer-uploader'
description: 'Upload test runs and reports to Gaffer'
author: 'gaffer.sh'

branding:
  icon: 'monitor'
  color: 'blue'

inputs:
  gaffer_upload_token:
    description: 'Upload token for your Gaffer project (gfr_ prefix)'
    required: false
  gaffer_api_key:
    description:
      '[DEPRECATED - use gaffer_upload_token] Upload token for your Gaffer
      project'
    required: false
    deprecationMessage:
      'gaffer_api_key is deprecated. Please use gaffer_upload_token instead.'
  report_path:
    description: 'Path to the relevant report file or directory to upload.'
    required: false
  api_endpoint:
    description: 'Custom API endpoint URL (for preview/staging environments).'
    required: false
  commit_sha:
    description: 'Git commit SHA to associate with the test run report.'
    required: false
  branch:
    description: 'Git branch to associate with the test run report.'
    required: false
  test_framework:
    description: 'Test framework to associate with the test run report.'
    required: false
  test_suite:
    description:
      'Optional name of the test suite to associate with the test run report.'
    required: false
  upload_timeout:
    description: 'Upload timeout in seconds. Defaults to 30.'
    required: false
    default: '30'
  max_file_size_mb:
    description:
      'Maximum size of any individual file to upload, in MB. Defaults to 100.'
    required: false
    default: '100'
  debug:
    description: 'Enable debug logging, including full API responses.'
    required: false
    default: 'false'

outputs:
  status:
    description: 'Upload status. "success" when the upload completed.'
  test_run_id:
    description: 'Gaffer upload session / test run ID.'
  project_id:
    description: 'Gaffer project ID that received the upload.'

runs:
  using: node24
  main: dist/index.js
