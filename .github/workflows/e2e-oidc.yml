# Exercises the OIDC-without-a-token path against a live preview server,
# using this repo's own `./` action (dist/index.js as it exists on the
# branch, not a released tag).
#
# Runs on every pull request since v2.1.0: the server's `/oauth/token`
# token-exchange grant is live and `DEFAULT_CLI_VERSION` pins a CLI release
# (0.7.0+) that performs the OIDC exchange itself.
name: E2E - OIDC upload

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  oidc-upload:
    name: Upload via OIDC, no stored token
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required: lets gaffer request a runner identity token
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate a tiny JUnit report
        run: |
          mkdir -p test-results
          cat > test-results/junit.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="e2e-oidc" tests="1" failures="0" errors="0">
              <testcase classname="e2e-oidc" name="placeholder" time="0"/>
            </testsuite>
          </testsuites>
          EOF

      - name: Upload to Gaffer via OIDC (no gaffer_upload_token)
        uses: ./
        with:
          report_path: ./test-results/junit.xml
          api_endpoint: https://preview.gaffer.sh
          commit_sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          test_framework: junit
          test_suite: e2e-oidc
          debug: 'true'
